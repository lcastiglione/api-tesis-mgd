services:
  api:
    build:
      context: .
      target: runtime
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "${API_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      DATABASE_PATH: /data/study.sqlite
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
